<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Glaucoma Detection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-teal-50 min-h-screen">
    <div class="container mx-auto px-6 py-12 max-w-4xl">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">👁️ Glaucoma Detection System</h1>
            <p class="text-lg text-gray-600">Upload a fundus image for AI-powered glaucoma screening.</p>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="mb-6">
                    {% for message in messages %}
                        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-2">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <div class="bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
            <form method="post" enctype="multipart/form-data" class="space-y-6">
                <div class="border-2 border-dashed border-gray-300 rounded-xl p-12 text-center hover:border-blue-400 transition">
                    <svg class="w-16 h-16 mx-auto text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 10h-5.903A4 4 0 017 16z"></path>
                    </svg>
                    <h3 class="text-xl font-semibold text-gray-700 mb-2">Upload Fundus Image</h3>
                    <p class="text-gray-500 mb-4">JPG, PNG up to 10MB</p>
                    <input type="file" name="file" accept=".jpg,.jpeg,.png" required class="hidden" id="file-input">
                    <label for="file-input" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-6 rounded-lg transition">Choose File</label>
                    <div class="mt-6 flex justify-center">
                        <img id="preview" class="hidden max-h-60 rounded-lg shadow" alt="Preview" />
                    </div>
                </div>
                <div class="text-center">
                    <button type="submit" class="bg-gradient-to-r from-blue-600 to-teal-500 hover:from-blue-700 hover:to-teal-600 text-white font-bold py-3 px-8 rounded-lg shadow-md transform hover:scale-105 transition">
                        Analyze Image
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const previewImg = document.getElementById('preview');
        fileInput.addEventListener('change', () => {
            const file = fileInput.files && fileInput.files[0];
            if (!file) {
                previewImg.src = '';
                previewImg.classList.add('hidden');
                return;
            }
            const url = URL.createObjectURL(file);
            previewImg.src = url;
            previewImg.onload = () => URL.revokeObjectURL(url);
            previewImg.classList.remove('hidden');
        });
    </script>
</body>
</html>
